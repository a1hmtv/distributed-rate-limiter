services:
  userservice:
    image: userservice
    build:
      context: .
      dockerfile: UserService/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__UsersDatabase: "Host=postgres;Port=5432;Database=slproject;Username=postgres;Password=${POSTGRES_PASSWORD:-local-demo-password}"
  
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: slproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-demo-password}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./UserService/Database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "slproject"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  ratelimiter-writer:
    build:
      context: .
      dockerfile: RateLimiter.Writer/Dockerfile
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      MongoDb__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDb__DatabaseName: "rate_limiter"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
        
  ratelimiter-reader:
    build:
      context: .
      dockerfile: RateLimiter.Reader/Dockerfile
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      MongoDb__ConnectionString: "mongodb://mongodb:27017/?replicaSet=rs0"
      MongoDb__DatabaseName: "rate_limiter"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:19092"
      Kafka__Topic: "user-requests"
      Kafka__GroupId: "reader"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
        
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  mongodb-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval '
          try { rs.status(); } catch (e) {
            if (e.code !== 94 && e.codeName !== "NotYetInitialized") throw e;
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
            if (!result.ok) throw new Error(JSON.stringify(result));
          }
        '
        for i in $$(seq 1 60); do
          if mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
            exit 0
          fi
          sleep 2
        done
        exit 1

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data
        
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_started
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 --list; do
          sleep 2
        done

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic user-requests \
          --partitions 1 \
          --replication-factor 1
        
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kafka-data:
